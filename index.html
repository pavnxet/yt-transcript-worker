<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Transcript Extractor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0f0f0f;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 600px;
        width: 100%;
        padding: 40px 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 24px;
      }

      .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 32px;
        font-size: 14px;
      }

      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #333;
        border-radius: 8px;
        background: #1a1a1a;
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #ff0000;
      }

      button {
        padding: 12px 24px;
        background: #ff0000;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      button:hover {
        background: #cc0000;
      }

      button:disabled {
        background: #333;
        cursor: not-allowed;
      }

      .status {
        text-align: center;
        color: #888;
        font-size: 14px;
        min-height: 20px;
      }

      .status.error {
        color: #ff4444;
      }

      .status.success {
        color: #44ff44;
      }

      .preview {
        margin-top: 24px;
        padding: 16px;
        background: #1a1a1a;
        border-radius: 8px;
        border: 1px solid #333;
        max-height: 300px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.6;
        color: #ccc;
        white-space: pre-wrap;
        display: none;
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
        display: none;
      }

      .actions button {
        background: #333;
        font-size: 13px;
        padding: 8px 16px;
      }

      .actions button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>YouTube Transcript</h1>
      <p class="subtitle">Extract transcripts from any YouTube video</p>

      <div class="input-group">
        <input
          type="text"
          id="url"
          placeholder="Paste YouTube URL or video ID"
        />
        <button id="fetchBtn" onclick="fetchTranscript()">Fetch</button>
      </div>

      <p class="status" id="status"></p>
      <div class="preview" id="preview"></div>
      <div class="actions" id="actions">
        <button onclick="copyTranscript()">Copy</button>
        <button onclick="downloadTranscript()">Download .txt</button>
      </div>
    </div>

    <script>
      let currentTranscript = "";
      let currentVideoId = "";

      const urlInput = document.getElementById("url");
      const fetchBtn = document.getElementById("fetchBtn");
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");
      const actions = document.getElementById("actions");

      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") fetchTranscript();
      });

      async function fetchTranscript() {
        const url = urlInput.value.trim();
        if (!url) {
          showStatus("Please enter a YouTube URL", true);
          return;
        }

        fetchBtn.disabled = true;
        showStatus("Fetching transcript...");
        preview.style.display = "none";
        actions.style.display = "none";

        try {
          const res = await fetch(`/api/transcript?url=${encodeURIComponent(url)}`);

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || "Failed to fetch");
          }

          currentTranscript = await res.text();
          currentVideoId = extractVideoId(url);

          preview.textContent = currentTranscript;
          preview.style.display = "block";
          actions.style.display = "flex";
          showStatus("Transcript fetched!", false, true);
        } catch (err) {
          showStatus(err.message, true);
        } finally {
          fetchBtn.disabled = false;
        }
      }

      function extractVideoId(url) {
        const patterns = [
          /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
          /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
          /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
          /^([a-zA-Z0-9_-]{11})$/,
        ];
        for (const p of patterns) {
          const m = url.match(p);
          if (m) return m[1];
        }
        return "video";
      }

      function copyTranscript() {
        navigator.clipboard.writeText(currentTranscript);
        showStatus("Copied to clipboard!", false, true);
      }

      function downloadTranscript() {
        const blob = new Blob([currentTranscript], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${currentVideoId}-transcript.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function showStatus(msg, isError, isSuccess) {
        status.textContent = msg;
        status.className = "status" + (isError ? " error" : "") + (isSuccess ? " success" : "");
      }
    </script>
  </body>
</html>
